services:
  - type: web
    name: pastors-wives-hub-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'run:app'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
